# Alembic — só entra em cena pra mudança de schema que ALTER TABLE ADD
# COLUMN não resolve (renomear/remover coluna, mudar tipo). Adicionar coluna
# continua 100% automático via core/db.py::_add_missing_columns, sem
# precisar de arquivo de migração — ver alembic/versions/README.md.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url é definida em tempo de execução por core/migrations.py
# (fonte única de verdade: o mesmo AsyncEngine que a rota já usa) — nunca
# hardcodar caminho aqui.

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
