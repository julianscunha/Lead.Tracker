name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # techforge_sdk não é publicado no PyPI — mesma dependência de dev que
      # o README pede pra clonar localmente em .techforge-dev/ (repo público).
      - name: Clone Tech.Forge (fornece techforge_sdk)
        run: git clone --depth 1 https://github.com/julianscunha/Tech.Forge .techforge-dev

      - name: Instala dependências do backend
        run: |
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Roda a suíte de testes
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
