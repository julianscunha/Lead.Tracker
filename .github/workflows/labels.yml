name: Setup Labels

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Create labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: "feature", color: "0E8A16", description: "New feature" },
              { name: "bug", color: "D73A4A", description: "Bug fix" },
              { name: "improvement", color: "A2EEEF", description: "Improvement" },
              { name: "chore", color: "CFD3D7", description: "Maintenance" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (e) {
                if (e.status !== 422) {
                  throw e;
                }
              }
            }
